name: Moodle Plugin CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        moodle-branch: ['MOODLE_405_STABLE', 'master']
        php: ['8.1', '8.2', '8.3']
        database: ['mysqli', 'pgsql']
            
    steps:
      - name: Check out repository
        uses: actions/checkout@v3
        with:
          path: plugin

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pgsql, mysqli, gd, xmlrpc, soap, intl, zip

      - name: Run Moodle Plugin CI
        uses: moodlehq/moodle-plugin-ci@v4
        with:
          moodle-branch: ${{ matrix.moodle-branch }}
          database-type: ${{ matrix.database }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
