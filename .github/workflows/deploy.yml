name: Deploy to Server

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary
          if_key_exists: replace

      - name: Add Host to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          rsync -avz --no-perms --no-owner --no-group --delete --exclude '.git*' ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/ubuntu/moodle-project/mod/quiz/accessrule/sanad_lockdown/

      - name: Create Temporary Uninstall Placeholder for Old Plugin
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            OLD_PATH='/home/ubuntu/moodle-project/mod/quiz/accessrule/ewa_lockdown'
            NEW_PATH='/home/ubuntu/moodle-project/mod/quiz/accessrule/sanad_lockdown'
            
            # Clean and recreate old folder structure
            rm -rf \$OLD_PATH
            mkdir -p \$OLD_PATH/db
            
            # Copy version.php and replace 'sanad' with 'ewa'
            if [ -f \$NEW_PATH/version.php ]; then
              sed 's/sanad/ewa/g' \$NEW_PATH/version.php > \$OLD_PATH/version.php
            fi
            
            # Copy db/install.xml and replace 'sanad' with 'ewa'
            if [ -f \$NEW_PATH/db/install.xml ]; then
              sed 's/sanad/ewa/g' \$NEW_PATH/db/install.xml > \$OLD_PATH/db/install.xml
            fi
            
            # Copy lang folder if exists to avoid missing string errors
            if [ -d \$NEW_PATH/lang ]; then
              mkdir -p \$OLD_PATH/lang/en
              mkdir -p \$OLD_PATH/lang/ar
              sed 's/sanad/ewa/g' \$NEW_PATH/lang/en/quizaccess_sanad_lockdown.php > \$OLD_PATH/lang/en/quizaccess_ewa_lockdown.php 2>/dev/null || true
              sed 's/sanad/ewa/g' \$NEW_PATH/lang/ar/quizaccess_sanad_lockdown.php > \$OLD_PATH/lang/ar/quizaccess_ewa_lockdown.php 2>/dev/null || true
            fi
            
            echo 'Created old plugin placeholder for clean uninstall'
          "
