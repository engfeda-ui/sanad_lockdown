name: Deploy to Server

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary
          if_key_exists: replace

      - name: Add Host to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          rsync -avz --no-perms --no-owner --no-group --delete --exclude '.git*' ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/ubuntu/moodle-project/mod/quiz/accessrule/sanad_lockdown/

      - name: Delete Old ewa_lockdown Folder from Server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            # Path 1: local staging workspace
            chmod -R u+w /home/ubuntu/moodle-project/mod/quiz/accessrule/ewa_lockdown 2>/dev/null || true
            rm -rf /home/ubuntu/moodle-project/mod/quiz/accessrule/ewa_lockdown
            
            # Path 2: Apache web root directory (grant write permission first, then delete)
            chmod -R u+w /var/www/html/mod/quiz/accessrule/ewa_lockdown 2>/dev/null || true
            rm -rf /var/www/html/mod/quiz/accessrule/ewa_lockdown
            
            # Fallback with non-interactive sudo if needed
            sudo -n rm -rf /var/www/html/mod/quiz/accessrule/ewa_lockdown || true
            
            echo 'Successfully cleared old folder.'
          "
